{% extends "base.html" %}
{% block content %}
<h2 class="mb-4">Billing Reports</h2>

<div class="card p-3 mb-4">
    <div class="row align-items-end">
        <div class="col-md-3">
            <label class="form-label">Month</label>
            <select class="form-select" id="reportMonth">
                <option value="1">January</option><option value="2">February</option>
                <option value="3">March</option><option value="4">April</option>
                <option value="5">May</option><option value="6">June</option>
                <option value="7">July</option><option value="8">August</option>
                <option value="9">September</option><option value="10">October</option>
                <option value="11">November</option><option value="12">December</option>
            </select>
        </div>
        <div class="col-md-3">
            <label class="form-label">Year</label>
            <input type="number" class="form-control" id="reportYear" value="2026">
        </div>
        <div class="col-md-3">
            <button class="btn btn-primary mt-4" onclick="loadReport()">
                <i class="bi bi-file-earmark-bar-graph"></i> Generate Report
            </button>
        </div>
    </div>
</div>

<!-- Summary Cards -->
<div class="row mb-4" id="summaryCards" style="display:none;">
    <div class="col-md-3">
        <div class="card stat-card text-center p-3 bg-light">
            <h6>Total Litres</h6>
            <h4 id="rptTotalLitres" class="text-primary">0</h4>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card stat-card text-center p-3 bg-light">
            <h6>Total Amount</h6>
            <h4 id="rptTotalAmount" class="text-warning">₹0</h4>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card stat-card text-center p-3 bg-light">
            <h6>Received</h6>
            <h4 id="rptReceived" class="text-success">₹0</h4>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card stat-card text-center p-3 bg-light">
            <h6>Pending</h6>
            <h4 id="rptPending" class="text-danger">₹0</h4>
        </div>
    </div>
</div>

<!-- Report Table -->
<div class="card p-3">
    <table class="table table-striped table-hover">
        <thead>
            <tr>
                <th>#</th><th>Customer</th><th>Rate/L</th><th>Litres</th>
                <th>Amount</th><th>Received</th><th>Pending</th><th>Record Payment</th>
            </tr>
        </thead>
        <tbody id="reportTable"></tbody>
    </table>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('reportMonth').value = new Date().getMonth() + 1;

async function loadReport() {
    const month = document.getElementById('reportMonth').value;
    const year = document.getElementById('reportYear').value;

    const res = await fetch(`/api/reports/monthly?month=${month}&year=${year}`);
    const data = await res.json();

    document.getElementById('summaryCards').style.display = 'flex';
    document.getElementById('rptTotalLitres').textContent = data.summary.total_litres.toFixed(1);
    document.getElementById('rptTotalAmount').textContent = '₹' + data.summary.total_amount.toFixed(0);
    document.getElementById('rptReceived').textContent = '₹' + data.summary.total_received.toFixed(0);
    document.getElementById('rptPending').textContent = '₹' + data.summary.total_pending.toFixed(0);

    const tbody = document.getElementById('reportTable');
    tbody.innerHTML = data.customers.map((c, i) => `
        <tr>
            <td>${i+1}</td>
            <td>${c.customer_name}</td>
            <td>₹${c.rate_per_litre}</td>
            <td>${c.total_litres}</td>
            <td>₹${c.total_amount.toFixed(0)}</td>
            <td class="text-success">₹${c.received_payment.toFixed(0)}</td>
            <td class="text-danger">₹${c.pending_payment.toFixed(0)}</td>
            <td>
                <button class="btn btn-sm btn-outline-success" 
                    onclick="recordPayment(${c.customer_id}, '${c.customer_name}', ${c.pending_payment}, ${month}, ${year})">
                    <i class="bi bi-cash"></i> Pay
                </button>
            </td>
        </tr>
    `).join('');
}

async function recordPayment(customerId, name, pending, month, year) {
    const amount = prompt(`Record payment for ${name}\nPending: ₹${pending}\nEnter amount received:`);
    if (!amount || isNaN(amount)) return;

    const res = await fetch('/api/payments', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            customer_id: customerId,
            amount: parseFloat(amount),
            payment_date: new Date().toISOString().split('T')[0],
            month: month,
            year: year,
            notes: 'Payment recorded'
        })
    });
    if (res.ok) {
        alert('Payment recorded!');
        loadReport();
    }
}

loadReport();
</script>
{% endblock %}
