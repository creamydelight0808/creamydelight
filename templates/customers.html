{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Customers</h2>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addCustomerModal">
        <i class="bi bi-plus-circle"></i> Add Customer
    </button>
</div>

<div class="card p-3">
    <table class="table table-hover">
        <thead>
            <tr>
                <th>#</th><th>Name</th><th>Address</th><th>Phone</th>
                <th>Rate/Litre</th><th>Actions</th>
            </tr>
        </thead>
        <tbody id="customerTable"></tbody>
    </table>
</div>

<!-- Add Customer Modal -->
<div class="modal fade" id="addCustomerModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add New Customer</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">Name *</label>
                    <input type="text" class="form-control" id="custName">
                </div>
                <div class="mb-3">
                    <label class="form-label">Address</label>
                    <input type="text" class="form-control" id="custAddress">
                </div>
                <div class="mb-3">
                    <label class="form-label">Phone</label>
                    <input type="text" class="form-control" id="custPhone">
                </div>
                <div class="mb-3">
                    <label class="form-label">Rate per Litre (₹)</label>
                    <input type="number" class="form-control" id="custRate" value="55" step="0.5">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="addCustomer()">Add Customer</button>
            </div>
        </div>
    </div>
</div>

<!-- Edit Customer Modal -->
<div class="modal fade" id="editCustomerModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Edit Customer</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editCustId">
                <div class="mb-3">
                    <label class="form-label">Name</label>
                    <input type="text" class="form-control" id="editCustName">
                </div>
                <div class="mb-3">
                    <label class="form-label">Address</label>
                    <input type="text" class="form-control" id="editCustAddress">
                </div>
                <div class="mb-3">
                    <label class="form-label">Phone</label>
                    <input type="text" class="form-control" id="editCustPhone">
                </div>
                <div class="mb-3">
                    <label class="form-label">Rate per Litre (₹)</label>
                    <input type="number" class="form-control" id="editCustRate" step="0.5">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="updateCustomer()">Save Changes</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function loadCustomers() {
    const res = await fetch('/api/customers?active=true');
    const customers = await res.json();
    const tbody = document.getElementById('customerTable');
    tbody.innerHTML = customers.map((c, i) => `
        <tr>
            <td>${i+1}</td><td>${c.name}</td><td>${c.address}</td><td>${c.phone}</td>
            <td>₹${c.rate_per_litre}</td>
            <td>
                <button class="btn btn-sm btn-outline-primary" onclick="editCustomer(${JSON.stringify(c).replace(/"/g,'&quot;')})">
                    <i class="bi bi-pencil"></i>
                </button>
                <button class="btn btn-sm btn-outline-danger" onclick="deactivateCustomer(${c.id})">
                    <i class="bi bi-trash"></i>
                </button>
            </td>
        </tr>
    `).join('');
}

async function addCustomer() {
    const data = {
        name: document.getElementById('custName').value,
        address: document.getElementById('custAddress').value,
        phone: document.getElementById('custPhone').value,
        rate_per_litre: document.getElementById('custRate').value
    };
    const res = await fetch('/api/customers', {
        method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data)
    });
    if (res.ok) {
        bootstrap.Modal.getInstance(document.getElementById('addCustomerModal')).hide();
        loadCustomers();
    } else {
        const err = await res.json();
        alert(err.error);
    }
}

function editCustomer(c) {
    document.getElementById('editCustId').value = c.id;
    document.getElementById('editCustName').value = c.name;
    document.getElementById('editCustAddress').value = c.address;
    document.getElementById('editCustPhone').value = c.phone;
    document.getElementById('editCustRate').value = c.rate_per_litre;
    new bootstrap.Modal(document.getElementById('editCustomerModal')).show();
}

async function updateCustomer() {
    const id = document.getElementById('editCustId').value;
    const data = {
        name: document.getElementById('editCustName').value,
        address: document.getElementById('editCustAddress').value,
        phone: document.getElementById('editCustPhone').value,
        rate_per_litre: document.getElementById('editCustRate').value
    };
    await fetch(`/api/customers/${id}`, {
        method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data)
    });
    bootstrap.Modal.getInstance(document.getElementById('editCustomerModal')).hide();
    loadCustomers();
}

async function deactivateCustomer(id) {
    if (!confirm('Deactivate this customer?')) return;
    await fetch(`/api/customers/${id}`, {method: 'DELETE'});
    loadCustomers();
}

loadCustomers();
</script>
{% endblock %}
