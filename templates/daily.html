{% extends "base.html" %}
{% block content %}
<h2 class="mb-4">Daily Milk Entry</h2>

<div class="card p-3 mb-4">
    <div class="row align-items-end">
        <div class="col-md-4">
            <label class="form-label">Date</label>
            <input type="date" class="form-control" id="entryDate">
        </div>
        <div class="col-md-4">
            <button class="btn btn-primary mt-4" onclick="loadDailyForm()">
                <i class="bi bi-search"></i> Load Customers
            </button>
        </div>
        <div class="col-md-4 text-end">
            <span class="badge bg-info fs-6" id="dailyTotal">Total: 0 litres</span>
        </div>
    </div>
</div>

<div class="card p-3">
    <table class="table">
        <thead>
            <tr><th>#</th><th>Customer</th><th>Quantity (Litres)</th></tr>
        </thead>
        <tbody id="dailyEntryTable"></tbody>
    </table>
    <button class="btn btn-success btn-lg w-100" onclick="saveDailyEntries()">
        <i class="bi bi-check-circle"></i> Save All Entries
    </button>
</div>
{% endblock %}

{% block scripts %}
<script>
let customers = [];

document.getElementById('entryDate').value = new Date().toISOString().split('T')[0];

async function loadDailyForm() {
    const date = document.getElementById('entryDate').value;
    const custRes = await fetch('/api/customers');
    customers = await custRes.json();

    const delivRes = await fetch(`/api/deliveries?date=${date}`);
    const deliveries = await delivRes.json();
    const delivMap = {};
    deliveries.forEach(d => { delivMap[d.customer_id] = d.quantity_litres; });

    const tbody = document.getElementById('dailyEntryTable');
    tbody.innerHTML = customers.map((c, i) => `
        <tr>
            <td>${i+1}</td>
            <td>${c.name}</td>
            <td>
                <input type="number" class="form-control qty-input" 
                    data-customer-id="${c.id}" 
                    value="${delivMap[c.id] || 0}" 
                    step="0.5" min="0"
                    onchange="updateTotal()">
            </td>
        </tr>
    `).join('');
    updateTotal();
}

function updateTotal() {
    const inputs = document.querySelectorAll('.qty-input');
    let total = 0;
    inputs.forEach(inp => { total += parseFloat(inp.value) || 0; });
    document.getElementById('dailyTotal').textContent = `Total: ${total} litres`;
}

async function saveDailyEntries() {
    const date = document.getElementById('entryDate').value;
    const inputs = document.querySelectorAll('.qty-input');
    const entries = [];
    inputs.forEach(inp => {
        entries.push({
            customer_id: parseInt(inp.dataset.customerId),
            quantity_litres: parseFloat(inp.value) || 0
        });
    });

    const res = await fetch('/api/deliveries/bulk', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({date, entries})
    });
    const data = await res.json();
    alert(data.message);
}

loadDailyForm();
</script>
{% endblock %}
